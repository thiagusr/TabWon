[menu]
editores = 1          # 1|0 exibe ou oculta no menu os itens de criação/edição de DEF e CNV
consultorSQL = 1      # 1|0 exibe ou oculta no menu o consultor SQL
conversor = 1         # 1|0 exibe ou oculta no menu o conversor DBF ⟺ DBC

[consultas]
renomear = 1          # 1|0 exibe ou oculta no gerenciador a opção renomear
excluir = 1           # 1|0 exibe ou oculta no gerenciador a opção excluir

[cores]
paletas = TabWon_estilo_padrao.cor;TabWon_estilo_sepia.cor;TabWon_estilo_contraste.cor;TabWon_estilo_floresta.cor;TabWon_estilo_lavanda.cor;TabWon_estilo_grafite.cor;TabWon_estilo_turquesa.cor;TabWon_estilo_terracota.cor;TabWon_estilo_marinho.cor;TabWon_estilo_suave.cor    # Lista de estilos de cores disponíveis
corpadrao = TabWon_estilo_padrao.cor    # Arquivo de paleta de cores do sistema
modopadrao = 2        # 1|0|2 - Modo de cor padrão: 1 claro, 0 escuro, 2 conforme o sistema

[organizacao]
logs_identificador = Equipe A; Equipe B; Equipe C; Equipe D    # nome das equipes para organizar as Consultas salvas

[idioma]
idiomas = TabWon_lng_PTBR.lng,TabWon_lng_ENUS.lng,TabWon_lng_ESES.lng    # Lista de idiomas disponíveis
idiomapadrao = TabWon_lng_PTBR.lng    # PTBR = Português (Brasil), ENUS = Inglês (EUA), ESES = Espanhol (América Latina)

[icones]
modelos = Linear;Linear Grafite;Linear Colorido;Fino;Fino Preto;Grosso;Grosso Colorido;Solido;Solido Colorido;Solido Terra;Duotone;Duotone Colorido;Circular;Circular Colorido;Arredondado;Arredondado Colorido;Arredondado Pastel;Sombra;Gradiente;Neon    # Modelos de ícones na pasta TabWon_configs/icones
modelopadrao = Linear Colorido    # Modelo padrão dos ícones; Emoji usa os símbolos de texto
